# === AHOI WELT – Jekyll-Konfiguration ===
title: "AHOI WELT !"
tagline: "Kommt mit uns ein halbes Jahr lang auf die Reise …"
description: >-
  Ann-Kathrin & Tom auf großer Reise – Geschichten, Abenteuer und Fotos
  aus einem halben Jahr Weltreise. Heimathafen Hamburg.
author: "AK & Tom"
email: ""

baseurl: "/ahoi-welt"
url: "https://thomasvorndran.github.io"

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
timezone: Europe/Berlin

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Sammlung für die Reise-Sektionen (Kontinente & Länder)
collections:
  travel:
    output: true
    permalink: /travel/:path/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "travel" }
    values: { layout: "country" }

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .ruby-version
